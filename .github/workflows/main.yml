name: DexDictate CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  lint:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install pinned SwiftLint
        run: |
          set -euo pipefail
          SWIFTLINT_VERSION="$(cat .swiftlint-version)"
          echo "Expected SwiftLint version: $SWIFTLINT_VERSION"
          curl -sL -o /tmp/portable_swiftlint.zip \
            "https://github.com/realm/SwiftLint/releases/download/${SWIFTLINT_VERSION}/portable_swiftlint.zip"
          unzip -o -q /tmp/portable_swiftlint.zip -d /tmp/swiftlint-bin
          chmod +x /tmp/swiftlint-bin/swiftlint
          echo "/tmp/swiftlint-bin" >> "$GITHUB_PATH"

      - name: SwiftLint version
        run: swiftlint version

      - name: Strict lint against committed baseline
        run: swiftlint lint --strict --baseline .swiftlint-baseline.json

      # TEMPORARY — regenerates a full baseline from HEAD with the pinned SwiftLint binary so
      # it can be downloaded and diffed against the committed one, to correct entries whose
      # line numbers shifted from unrelated code changes. Removed once that's done; not meant
      # to stay in the workflow.
      - name: TEMP - regenerate baseline for inspection
        if: always()
        run: swiftlint lint --strict --write-baseline /tmp/regenerated-baseline.json || true

      - name: TEMP - upload regenerated baseline
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regenerated-swiftlint-baseline
          path: /tmp/regenerated-baseline.json

      - name: SwiftLint gate regression test
        run: bash scripts/test_swiftlint_gate.sh

  build-and-test:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            spm-${{ runner.os }}-

      - name: Cache Whisper model
        uses: actions/cache@v4
        id: model-cache
        with:
          path: Sources/DexDictateKit/Resources/tiny.en.bin
          key: whisper-tiny-en-${{ runner.os }}-921e4cf8

      - name: Fetch Whisper model
        if: steps.model-cache.outputs.cache-hit != 'true'
        run: bash scripts/fetch_model.sh

      - name: Verify Package.resolved is committed and up to date
        run: |
          swift package resolve
          if ! git diff --quiet -- Package.resolved; then
            echo "::error::Package.resolved changed after resolve — commit the updated file."
            git --no-pager diff -- Package.resolved
            exit 1
          fi

      - name: Build (debug)
        run: swift build -v

      - name: Build (release configuration)
        run: swift build -c release

      - name: Run tests (with coverage)
        run: swift test -v --enable-code-coverage
        # UI / end-to-end tests are not yet implemented (see docs/).

      - name: Coverage data location
        if: always()
        run: echo "codecov path is printed by swift test --show-codecov-path"

      # NOTE: signing/notarization/packaging (build.sh --release, validate_release.sh)
      # is intentionally NOT run in CI — it needs the local "DexDictate Development"
      # signing identity. Release packaging is a local, credential-free manual step.
