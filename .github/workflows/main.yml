name: DexDictate CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-and-test:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: swift build -v

      - name: Lint
        run: |
          if command -v swiftlint &>/dev/null; then
            swiftlint --strict
          else
            brew install swiftlint && swiftlint --strict
          fi

      - name: Cache Whisper model
        uses: actions/cache@v4
        id: model-cache
        with:
          path: Sources/DexDictateKit/Resources/tiny.en.bin
          key: whisper-tiny-en-${{ runner.os }}-921e4cf8

      - name: Fetch Whisper model
        if: steps.model-cache.outputs.cache-hit != 'true'
        run: bash scripts/fetch_model.sh

      - name: Run tests
        run: swift test -v
        # UI tests: not yet implemented. See DEXDICTATE_FIX_PLAN.md Issue 10.
